          }
        },
        {
          "targets": [
            "echecker:8080"
          ],
          "labels": {
            "service": "echecker"
          }
        },
        {
          "targets": [
            "draft:8080"
          ],
          "labels": {
            "service": "draft"
          }
        },
        {
          "targets": [
            "mdfixer:8080"
          ],
          "labels": {
            "service": "mdfixer"
          }
        }
      ]
    }
  ]
}
